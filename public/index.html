<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>svg2ui8a demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1><a href="https://jsr.io/@tksh/svg2ui8a">@tksh/svg2ui8a</a> demo</h1>

      <section class="controls">
        <label>Sample
          <select id="sample">
            <option value="ghostscript_tiger.svg" selected>Ghostscript Tiger</option>
            <option value="straightlines.svg">Straightlines</option>
          </select>
        </label>
        <label>Width <input id="width" type="number" value="512" min="1" max="4096" /></label>
        <label>Height <input id="height" type="number" value="512" min="1" max="4096" /></label>
        <label><input id="dpr" type="checkbox" checked /> Auto size × devicePixelRatio</label>
        <label><input id="pixelated" type="checkbox" /> Pixelated (raw pixels)</label>
        <button id="render">Render</button>
      </section>

      <section>
        <h2>SVG rasterize (<code>svg2rgba</code>)</h2>
        <p id="status" role="status">Loading…</p>
        <div class="gallery">
          <figure>
            <figcaption>Native SVG (<code>&lt;img&gt;</code>)</figcaption>
            <img id="native" src="/ghostscript_tiger.svg"
              alt="Sample artwork, native SVG rendering" />
          </figure>
          <figure>
            <figcaption>svg2ui8a RGBA (<code>&lt;canvas&gt;</code>)</figcaption>
            <canvas id="output"></canvas>
          </figure>
        </div>
      </section>

      <section>
        <h2>usvg intermediate (<code>svg2usvg</code>)</h2>
        <p id="usvg-meta">Loading…</p>
        <pre><code id="usvg">Loading…</code></pre>
      </section>

      <section>
        <h2>SVG source (editable)</h2>
        <textarea id="source" rows="18" spellcheck="false"></textarea>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
